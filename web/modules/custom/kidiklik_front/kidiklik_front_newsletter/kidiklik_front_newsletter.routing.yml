kidiklik_front_newsletter.newsletter_form:
  path: '/newsletter.html'
  defaults:
    _form: '\Drupal\kidiklik_front_newsletter\Form\DefaultForm'
    _title: 'Inscription à la newsletter'
  requirements:
    _access: 'TRUE'

kidiklik_front_newsletter.registration:
  path: '/registration.html'
  defaults:
    _controller: '\Drupal\kidiklik_front_newsletter\Controller\DefaultController::sendConfirmationEmail'
    _title: 'Inscription à la newsletter'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'

kidiklik_front_newsletter.confirmation:
  path: '/confirmation.html'
  defaults:
    _controller: '\Drupal\kidiklik_front_newsletter\Controller\DefaultController::send'
    _title: "Confirmation d'inscription"
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'

kidiklik_front_newsletter.view_registration:
  path: '/waiting_confirmation.html'
  defaults:
    _controller: '\Drupal\kidiklik_front_newsletter\Controller\DefaultController::viewConfirmationMail'
    _title: "Confirmation d'inscription"
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'
